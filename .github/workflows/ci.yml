name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mint
        run: brew bundle --file=Brewfile

      - name: Build development tools
        run: mint bootstrap

      - name: Install Chart Inspector dependencies
        run: npm --prefix Tools/ChartInspector ci --ignore-scripts

      - name: Verify repository
        run: Scripts/verify.sh
