name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install Mint
        run: brew bundle --file=Brewfile

      - name: Build development tools
        run: mint bootstrap

      - name: Install Chart Inspector dependencies
        run: npm --prefix Tools/ChartInspector ci --ignore-scripts

      - name: Verify repository
        run: Scripts/verify.sh
